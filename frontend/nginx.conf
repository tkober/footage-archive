server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large request bodies (e.g. future uploads); responses like clip
    # previews are served back through this proxy too.
    client_max_body_size 100m;

    # Original-video streaming (#109): a more specific location than /api/
    # below, matched first by nginx regardless of declaration order. The
    # Range header is passed through to the backend by default, but
    # buffering is not: nginx normally reads the whole upstream response
    # into a temp file before forwarding it, which would defeat Range
    # seeking on large originals and add needless disk I/O. Turn buffering
    # off so bytes stream straight through, and raise the read timeout for
    # a slow client scrubbing through a large file.
    location /api/files/stream/ {
        proxy_pass http://backend:8051/files/stream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    # Reverse-proxy API calls to the backend. The trailing slash on proxy_pass
    # strips the /api prefix, so /api/config -> backend /config, etc.
    # "backend" must resolve to the backend container — run both on a shared
    # docker network and name the backend container "backend" (or change this).
    location /api/ {
        proxy_pass http://backend:8051/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Scans run as background tasks (return quickly), but keep generous
        # timeouts for the occasional slow probe/preview generation.
        proxy_read_timeout 300s;
    }

    # SPA fallback: let the Angular router handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
