name: Build backend Docker image

on:
  push:
    branches: ["main"]
    # The Dockerfile copies the whole repo (COPY ./ ./), so only skip what
    # never lands in the image or doesn't affect it — a whitelist missed
    # fileops/, exports/ and mlflow/ (#154 never got built).
    paths-ignore:
      - "frontend/**"
      - "tests/**"
      - "footage/**"
      - "dbeaver/**"
      - ".idea/**"
      - ".vscode/**"
      - "**.md"
      - "*.sh"
      - ".github/workflows/publish-frontend.yml"
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/tkober/footage-archive-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      # Tag pushes (v1.2.3) report that semver; branch pushes report the short SHA.
      - name: Resolve version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
