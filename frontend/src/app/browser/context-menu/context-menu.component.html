<div class="ctx-backdrop" (click)="close.emit()"></div>
<ul class="ctx-menu" [style.left.px]="x" [style.top.px]="y">
  @if (entry.type === 'directory') {
    <li class="ctx-item" (click)="emit('scan')">Scan directory</li>
    <li class="ctx-item" (click)="emit('rediscover')">Rediscover</li>
  } @else {
    <li class="ctx-item" (click)="emit('track')">Track file</li>
  }
  <li class="ctx-item" (click)="emit('rename')">Rename</li>
  <li class="ctx-item" (click)="emit('move')">Move to…</li>
</ul>
