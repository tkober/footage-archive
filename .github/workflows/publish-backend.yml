name: Build backend Docker image

on:
  push:
    branches: ["main"]
    # The Dockerfile copies the whole repo (COPY ./ ./), so only skip what
    # never lands in the image or doesn't affect it — a whitelist missed
    # fileops/, exports/ and mlflow/ (#154 never got built).
    paths-ignore:
      - "frontend/**"
      - "tests/**"
      - "footage/**"
      - "dbeaver/**"
      - ".idea/**"
      - ".vscode/**"
      - "**.md"
      - "*.sh"
      - ".github/workflows/publish-frontend.yml"
    tags: ["v*.*.*"]

  # A PR build with no push: there is no Docker in this dev environment, so a
  # broken Dockerfile would otherwise only surface once it lands on main.
  pull_request:
    paths-ignore:
      - "frontend/**"
      - "tests/**"
      - "footage/**"
      - "dbeaver/**"
      - ".idea/**"
      - ".vscode/**"
      - "**.md"
      - "*.sh"
      - ".github/workflows/publish-frontend.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # QEMU lets buildx produce the arm64 variant on this amd64 runner (Apple
      # Silicon Macs, issue tkober/compose-stacks-unraid#19).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Skipped on a PR: it carries no credentials to push with, and GHCR
      # login is pointless (and would fail for a fork PR) when nothing below
      # pushes anyway.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/tkober/footage-archive-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      # Tag pushes (v1.2.3) report that semver; branch pushes report the short SHA.
      - name: Resolve version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Build-only on a PR, so a broken Dockerfile shows up in the PR
          # instead of only failing once it reaches main.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
